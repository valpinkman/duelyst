name: lint_javascript

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    paths:
      - .mocharc.js
      - app/**.js
      - bulk-decaffeinate.config.js
      - cli/**.js
      - config/**.js
      - desktop/**.js
      #- packages/**.js
      - scripts/**.js
      - server/**.js
      - test/**.js
      - worker/**.js

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - name: check out code
      uses: actions/checkout@v4

    - name: install pnpm
      uses: pnpm/action-setup@v4

    - name: install node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: install node dependencies
      run: pnpm install --frozen-lockfile

    - name: compile typescript dependencies
      run: pnpm tsc:chroma-js

    - name: lint javascript code
      run: pnpm lint:js:all

    # guards the binding class of bug the bluebird codemods introduced:
    # a file using PromiseUtils/onType without requiring it passes lint and
    # unit tests, then throws ReferenceError at runtime.
    - name: check utils_promise bindings
      run: pnpm check:promise-utils
