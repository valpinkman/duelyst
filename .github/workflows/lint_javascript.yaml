name: lint_javascript

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .mocharc.js
      - app/**.js
      - bulk-decaffeinate.config.js
      - cli/**.js
      - config/**.js
      - desktop/**.js
      #- packages/**.js
      - scripts/**.js
      - server/**.js
      - test/**.js
      - worker/**.js

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: lint javascript code
        run: pnpm lint

      # oxfmt owns JS/TS/JSON/MD/YAML formatting; .editorconfig covers only what
      # it does not (templates, styles, shaders).
      - name: check formatting
        run: pnpm format:check

      # turbo 2 strips undeclared env vars from tasks, and every convict setting is
      # baked into the client bundle at build time -- a missing entry silently ships
      # the schema default instead of failing
      - name: check turbo env coverage
        run: pnpm check:turbo-env

      # guards the binding class of bug the bluebird codemods introduced:
      # a file using PromiseUtils/onType without requiring it passes lint and
      # unit tests, then throws ReferenceError at runtime.
      - name: check utils_promise bindings
        run: pnpm check:promise-utils

      # the mirror-image bug: a file that uses a bluebird-only API but no longer
      # requires bluebird. worker.ts and api.ts shipped exactly this
      # (Promise.longStackTraces) and crashed on boot; lint and 1350 unit tests
      # were both green.
      - name: check for bluebird orphans
        run: pnpm check:bluebird-orphans

      # TS2304 is a list of identifiers that do not exist -- ReferenceErrors
      # waiting to happen. The linter's no-undef does not apply to .ts, so TypeScript is the
      # only thing that sees them. The count was swept to zero, and this keeps it
      # there: a codemod regression that shipped once would have been caught here.
      # app/sdk and app/common used to require each other, which made them one
      # package with a directory between them. Broken 2026-08-21 by moving three
      # files; this keeps it broken, and checks relative requires too -- the
      # move's first attempt rewrote only the root-absolute form.
      - name: check package layering
        run: pnpm check:package-deps

      - name: check for undefined names (TS2304)
        run: pnpm check:undefined-names

      # The whole typecheck is a gate now that the backlog is zero (2026-08-21).
      # It was a metric for as long as the number was 362 and nobody could tell a
      # new error from an inherited one. TS2304 keeps its own step above because
      # it is the class that becomes a ReferenceError at runtime, and a targeted
      # failure message is worth more than one line inside a longer report.
      - name: typecheck (must stay at zero)
        run: pnpm typecheck
