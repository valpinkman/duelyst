name: firebase_rules

# Security rules are the one artifact here that guards live player data and is
# NOT exercised by the other suites: the integration tests connect with a
# service account, and admin credentials bypass rules entirely, so they stay
# green even if the rules are completely broken.

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'ALSO deploy rules to PRODUCTION (duelyst-universe)'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - firebaseRules.json
      - firebase.json
      - test/rules/**
  pull_request:
    paths:
      - firebaseRules.json
      - firebase.json
      - test/rules/**

jobs:
  # Runs against the emulator, so it needs no cloud project and no secrets -
  # which means it also runs on pull requests from forks.
  test_rules:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: use node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the database emulator is a JAR; firebase-tools 14 accepts JDK 17+
      - name: use java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: run security rules tests
        run: pnpm test:rules

  # duelyst-ci only. Automatic, because nobody plays on it - this is the
  # rehearsal that makes the production deploy boring.
  deploy_ci:
    needs: test_rules
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_CI_SERVICE_ACCOUNT }}
    steps:
      - name: check out code
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: use node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: deploy rules to duelyst-ci
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            pnpm exec firebase deploy --only database --project duelyst-ci --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: note skipped deploy
        if: env.SA == ''
        run: echo "::notice title=CI rules deploy skipped::Set the FIREBASE_CI_SERVICE_ACCOUNT secret to enable it."

  # PRODUCTION. Never automatic: manual dispatch, an explicit checkbox, and its
  # own secret, so no merge can reach the database real accounts live in.
  deploy_production:
    needs: test_rules
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_PRODUCTION_SERVICE_ACCOUNT }}
    steps:
      - name: check out code
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: use node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: fail if the production secret is missing
        if: env.SA == ''
        run: |
          echo "::error title=Missing secret::FIREBASE_PRODUCTION_SERVICE_ACCOUNT is not set."
          exit 1

      - name: deploy rules to duelyst-universe
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            pnpm exec firebase deploy --only database --project duelyst-universe --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
