# Packaging for the Duelyst desktop shell.
#
# The app is deliberately tiny: main and preload are bundled by Vite
# (see vite.config.mjs), so `files` ships two .cjs files and no node_modules.
# The game itself - ~560 MB of art, audio and code produced by the root
# `pnpm build` - rides along as an UNPACKED resource rather than inside the
# asar, because cocos2d streams those files from disk at runtime.
appId: com.counterplay.duelyst
productName: Duelyst
copyright: OpenDuelyst contributors

directories:
  output: dist/build
  buildResources: .

files:
  - build/**
  - package.json
  # nothing is required at runtime: main and preload are bundled. Without this,
  # electron-builder walks up to the pnpm workspace root and packs the whole
  # repository's node_modules into the asar.
  - '!node_modules/**'

extraResources:
  - from: ../../dist/src
    to: client

asar: true

mac:
  category: public.app-category.strategy-games
  target:
    - target: dir
  icon: icon.icns
  # unsigned local builds: signing belongs to a release pipeline
  identity: null

win:
  target:
    - target: dir
  icon: icon.ico

linux:
  target:
    - target: dir
  icon: icon.png
  category: Game
